name: ingest tests

on:
  push:
  pull_request:

jobs:
  ingest-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: pegwatch
          POSTGRES_PASSWORD: pegwatch
          POSTGRES_DB: pegwatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pegwatch" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://pegwatch:pegwatch@localhost:5432/pegwatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "./ingest[test]"
      - run: pytest -q ingest/tests
